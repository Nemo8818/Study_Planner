<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan study sessions, track subjects, and mark tasks complete." />
    <title>Study Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <p class="eyebrow">Stay on track</p>
        <h1>Study Planner</h1>
        <p class="lede">
          Add subjects, pick a date, and set how long you will study. Check tasks
          off as you finish them.
        </p>
      </header>

      <section class="panel" aria-labelledby="add-task-heading">
        <h2 id="add-task-heading">Add a study task</h2>
        <form id="task-form" novalidate>
          <div class="field-grid">
            <label class="field">
              <span>Subject</span>
              <input
                type="text"
                id="subject"
                name="subject"
                placeholder="e.g. Biology"
                maxlength="80"
                required
                autocomplete="off"
              />
            </label>
            <label class="field">
              <span>Date</span>
              <input type="date" id="date" name="date" required />
            </label>
            <label class="field">
              <span>Study time (minutes)</span>
              <input
                type="number"
                id="study-time"
                name="studyTime"
                min="1"
                max="1440"
                step="1"
                placeholder="e.g. 45"
                required
              />
            </label>
          </div>
          <p class="form-error" id="form-error" role="alert" hidden></p>
          <button type="submit" class="btn-primary">Add Task</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="tasks-heading">
        <div class="panel-header">
          <h2 id="tasks-heading">Study tasks</h2>
          <div class="counters" id="task-counter" aria-live="polite">
            <span><strong id="count-total">0</strong> total</span>
            <span><strong id="count-open">0</strong> open</span>
            <span><strong id="count-done">0</strong> done</span>
          </div>
        </div>
        <ul id="task-list" class="task-list"></ul>
        <p class="empty" id="empty-state">No study tasks yet. Add your first one above.</p>
      </section>
    </div>
    <script src="script.js"></script>
  </body>
</html>
